name: CI

# Personal fork: one Linux job that mirrors the local gate in AGENTS.md.
# No macOS matrix, no release or site pipelines, no scheduled advisory
# audit, no crates.io publish. The desktop GUI crate (gui/src-tauri) needs
# WebKitGTK and is checked locally, so CI builds the aiw package only.

on:
  push:
    branches: ["main", "ai-workstation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git tmux bash coreutils procps

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: No network libraries in the binary
        run: scripts/check-no-network.sh

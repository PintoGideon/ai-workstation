name: Build site

# Builds site/ with Zola as a check that the docs pages still render. This is
# a private fork with no Cloudflare Pages project: the upstream deploy step
# was removed because a private repository cannot resolve the third-party
# `cloudflare/pages-action` at job setup, which failed the run before any
# `if:` guard could skip it. Publishing, if ever wanted, is a separate
# workflow with its own secrets (see site/README.md).

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.23.5/zola-v0.23.5-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola

      - name: Build
        working-directory: site
        run: zola build

[workspace]
members = ["gui/src-tauri"]
# The workspace root is this package itself (the common root-crate-as-member
# layout) rather than a virtual manifest, so the root Cargo.toml location
# is unchanged. No `resolver` override: the
# workspace inherits the root package's edition-2024 default (resolver "3").

[package]
name = "ai-workstation"
version = "0.49.0"
edition = "2024"
description = "AI Workstation: terminal dashboard for running many AI coding agents in parallel — each on its own branch, in its own tmux session"
license = "MIT"
readme = "README.md"
keywords = ["tui", "tmux", "agents", "claude", "worktree"]
categories = ["command-line-utilities", "development-tools"]
# A private fork: never published to crates.io.
publish = false

[lib]
name = "ai_workstation"
path = "src/lib.rs"

# FORK: the single `aiw` command (AI Workstation).
[[bin]]
name = "aiw"
path = "src/main.rs"

[dependencies]
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which measures
# a paragraph with the exact `WordWrapper` the renderer uses. Scroll clamps that
# need post-wrap row counts use it instead of re-deriving Ratatui's wrapping.
# `unstable-widget-ref` is what `ratatui-explorer` renders through
# (`FrameExt::render_widget_ref`); named here so our use of it does not depend on
# feature unification.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
throbber-widgets-tui = "0.11"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
vt100 = "0.15"
ratatui-explorer = "0.3"
# Same major as ratatui-core's, so the widths our layout code measures (list
# truncation, toasts, diff columns) match the widths ratatui renders with.
unicode-width = "0.2"
regex = "1"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.26"
pulldown-cmark = "0.13"
tempfile = "3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8.2.0"
# FORK(no-cloud): the Remote Control server stack (tokio, axum, qrcode,
# web-push-native, p256), the HTTP client (ureq) and the GitHub screenshot
# downloader's crates (zip, scraper) are gone — AIW links no HTTP client or
# server library. See NO_CLOUD.md and scripts/check-no-network.sh.
# Data-URL encoding for local screenshot evidence (`src/screenshot_evidence.rs`).
base64ct = { version = "1", features = ["alloc"] }
# Sec-WebSocket-Accept check for the local Codex control-socket handshake
# (`src/app/model_analysis/local_ws.rs`, which speaks WebSocket framing itself
# over the `codex app-server proxy` stdio pipe — no network).
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
url = "2"

[dev-dependencies]
# FORK(no-cloud): test-only reference WebSocket server for the hand-rolled
# Codex control-socket client. Not linked into the binaries.
tungstenite = "0.29"
mockall = "0.13"

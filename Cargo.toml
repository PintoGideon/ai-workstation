[workspace]
members = ["gui/src-tauri"]
# The workspace root is this package itself (the common root-crate-as-member
# layout) rather than a virtual manifest, so the root Cargo.toml location
# is unchanged. No `resolver` override: the
# workspace inherits the root package's edition-2024 default (resolver "3").

[package]
name = "ai-workstation"
version = "0.49.0"
edition = "2024"
description = "AI Workstation: terminal dashboard for running many AI coding agents in parallel — each on its own branch, in its own tmux session"
license = "MIT"
readme = "README.md"
keywords = ["tui", "tmux", "agents", "claude", "worktree"]
categories = ["command-line-utilities", "development-tools"]
# Keep the packaged .crate under crates.io's 10MB compressed hard cap (an
# oversized upload gets rejected with a 413 that their CDN mangles into an
# opaque 503 — see docs/backlog/crate-package-size-plan.md). Everything
# excluded here is dev tooling / docs with no `include_str!`/`include_bytes!`
# reference from src/; docs/tsx-syntax-test.tsx and docs/syntax-tests/ are
# kept because src/highlight and src/ui/dialogs/diff.rs embed them.
exclude = [
    "/.agents",
    "/.claude",
    "/.codex",
    "/docker",
    "/examples",
    "/site",
    "/docs/automation",
    "/docs/backlog",
    "/docs/batched-review.md",
    "/docs/context-usage-telemetry.md",
    "/docs/development",
    "/docs/docker-no-tmux.md",
    "/docs/final-review-subagent-notes-investigation.md",
    "/docs/repository-cleanup-audit.md",
    "/docs/screenshots",
    "/docs/usability-review.md",
    "/gui",
]

[lib]
name = "ai_workstation"
path = "src/lib.rs"

# FORK: the single `aiw` command (AI Workstation).
[[bin]]
name = "aiw"
path = "src/main.rs"

[dependencies]
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which measures
# a paragraph with the exact `WordWrapper` the renderer uses. Scroll clamps that
# need post-wrap row counts use it instead of re-deriving Ratatui's wrapping.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
throbber-widgets-tui = "0.8"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
vt100 = "0.15"
ratatui-explorer = "0.2"
unicode-width = "0.1"
regex = "1"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.26"
pulldown-cmark = "0.13"
tempfile = "3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8.2.0"
# FORK(no-cloud): the Remote Control server stack (tokio, axum, qrcode,
# web-push-native, p256), the HTTP client (ureq) and the GitHub screenshot
# downloader's crates (zip, scraper) are gone — AIW links no HTTP client or
# server library. See NO_CLOUD.md and scripts/check-no-network.sh.
# Data-URL encoding for local screenshot evidence (`src/screenshot_evidence.rs`).
base64ct = { version = "1", features = ["alloc"] }
# Sec-WebSocket-Accept check for the local Codex control-socket handshake
# (`src/app/model_analysis/session_control.rs`, which speaks WebSocket framing
# itself over the `codex app-server proxy` stdio pipe — no network).
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
url = "2"

[dev-dependencies]
# FORK(no-cloud): test-only reference WebSocket server for the hand-rolled
# Codex control-socket client. Not linked into the binaries.
tungstenite = "0.29"
mockall = "0.13"
pretty_assertions = "1"

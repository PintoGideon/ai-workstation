[package]
name = "aiw-gui"
version = "0.1.0"
description = "AI Workstation desktop shell (Tauri) — alongside the aiw TUI, sharing its core library"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Path dependency on the existing TUI package's library target. This
# intentionally pulls in
# ratatui/crossterm/vt100 the GUI does not use yet rather than forcing an
# upfront presentation-free core-crate split.
ai-workstation = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "aiw-gui"
path = "src/main.rs"

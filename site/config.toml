# Zola config for the AIW marketing + docs site.
# https://www.getzola.org/documentation/getting-started/configuration/
#
# The site is built locally only (`zola serve`); AIW has no public domain.
# Zola uses this to build every absolute link, canonical tag, and sitemap
# entry.
base_url = "http://127.0.0.1:1111"
title = "AI Workstation"
description = "Run multiple AI coding agents in parallel, each on its own branch and in its own terminal, without losing track of them."
default_language = "en"
compile_sass = true
build_search_index = true
generate_feeds = false

[markdown]

[markdown.highlighting]
error_on_missing_language = true
style = "inline"
theme = "github-dark"

[search]
include_content = true

[extra]
github_url = "/docs/installation/"
releases_url = "/docs/installation/"
